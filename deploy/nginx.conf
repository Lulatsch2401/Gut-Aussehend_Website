# Vorlage: deploy.sh ersetzt __PORT__, __BASE__, __KONTAKT_PORT__ und schreibt das Ergebnis auf den Pi.
server {
    listen __PORT__;
    server_name _;
    root __BASE__/site;
    index index.html;
    server_tokens off;

    # Passwortschutz für die ganze Seite (an/aus über deploy.sh)
    include __BASE__/auth.conf;
    charset utf-8;

    access_log /var/log/nginx/gut-aussehend.access.log;
    error_log /var/log/nginx/gut-aussehend.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # HTML immer frisch, damit Änderungen sofort sichtbar sind
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Kontaktformular: an den kleinen Python-Dienst auf dem Pi weiterreichen (deploy/kontakt.py)
    location = /api/kontakt {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:__KONTAKT_PORT__;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
    }

    # Bilder, Schriften, CSS und JS eine Woche im Browser zwischenspeichern (CSS/JS haben ?v=...)
    location /assets/ {
        # "private": nur der Browser speichert, nicht Cloudflare.
        # Sonst könnte Cloudflare Bilder ohne Passwort an andere ausliefern.
        expires 7d;
        add_header Cache-Control "private" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien nie ausliefern
    location ~ /\. { deny all; }
}
