# Gut und Aussehend – Website auf dem Raspberry Pi
# web:    nginx liefert die statischen Dateien aus ./site aus (im Heimnetz auf Port 8080)
# tunnel: Cloudflare Tunnel macht die Seite unter gut-aussehend.de erreichbar,
#         ohne dass am Router ein Port geöffnet wird. Startet nur, wenn in .env ein TUNNEL_TOKEN steht.
#         Wird ein schon vorhandener Tunnel auf dem Pi genutzt, bleibt .env leer und nur web läuft.
services:
  web:
    image: nginx:1.27-alpine
    container_name: ga-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Passwortschutz: legt deploy.sh an (ga-auth.conf an/aus, ga-htpasswd mit dem Passwort-Hash)
      - ./ga-auth.conf:/etc/nginx/ga-auth.conf:ro
      - ./ga-htpasswd:/etc/nginx/ga-htpasswd:ro

  tunnel:
    image: cloudflare/cloudflared:2024.8.3
    container_name: ga-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]
